name: PR Merged Comment

on:
  pull_request_target:
    types:
      - closed

jobs:
  comment-on-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      pull-requests: write
    steps:
      - name: Generate token (if using GitHub App)
        id: generate-token
        if: secrets.REPOOWL_APP_ID != '' && secrets.REPOOWL_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REPOOWL_APP_ID }}
          private-key: ${{ secrets.REPOOWL_PRIVATE_KEY }}

      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ' Merged! Thanks for contributing to RepoOwl.\n\nIf the project has been useful to you, a * star on the repo is the easiest way to support it -- it helps RepoOwl get discovered by more developers.\n\nKeep an eye on open issues for your next contribution!'
            })
