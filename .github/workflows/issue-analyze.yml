name: RepoOwl Issue Analyzer

on:
  issues:
    types: [opened]
  schedule:
    # Sweep for any missed issues every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  issues: read
  contents: read

jobs:
  analyze-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Generate token (if using GitHub App)
        id: generate-token
        if: secrets.REPOOWL_APP_ID != '' && secrets.REPOOWL_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REPOOWL_APP_ID }}
          private-key: ${{ secrets.REPOOWL_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run RepoOwl Issue Analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REPOSITORY: ${{ github.repository }}
          # Only set on issues.opened ÃÂ¢Ã¢ÂÂ¬Ã¢ÂÂ empty string on schedule/dispatch
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/analyze-issue.js
