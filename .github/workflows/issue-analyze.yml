name: RepoOwl Issue Analyzer

on:
  issues:
    types: [opened]
  schedule:
    # Run every minute for testing logger
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  issues: read
  contents: write

jobs:
  analyze-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run RepoOwl Issue Analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REPOSITORY: ${{ github.repository }}
          # Only set on issues.opened — empty string on schedule/dispatch
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/analyze-issue.js

      - name: Commit Sync Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logger.md || true
          git commit -m "chore: update sync log [skip ci]" || echo "No changes to commit"
          git push
