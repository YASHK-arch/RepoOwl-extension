name: RepoOwl Issue Analyzer

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  schedule:
    # Sweep for any missed issues every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  analyze-issue:
    runs-on: ubuntu-latest
    # Skip if triggered by a comment that is NOT the /analyze command
    if: |
      github.event_name != 'issue_comment' ||
      (startsWith(github.event.comment.body, '/analyze') && !github.event.issue.pull_request)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run RepoOwl Issue Analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REPOSITORY: ${{ github.repository }}
          # Set on issues.opened — empty string on schedule/dispatch
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # Set when triggered by /analyze comment
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          # Configurable inactivity delay in seconds (0 = run immediately).
          # Increase this to e.g. 300 when you want a 5-minute buffer for issue edits.
          ANALYSIS_DELAY_SECONDS: '0'
        run: node .github/scripts/analyze-issue.js
