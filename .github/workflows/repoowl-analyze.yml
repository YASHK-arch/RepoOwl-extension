name: RepoOwl PR Analyzer

on:
  pull_request_target:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  analyze-pr:
    # Only run if it's a PR creation OR if the comment contains exactly "/analyze" (or "/analyse")
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && github.event.sender.login != 'github-actions[bot]' && (startsWith(github.event.comment.body, '/analyze') || startsWith(github.event.comment.body, '/analyse')))

    runs-on: ubuntu-latest

    steps:
      - name: Generate token (if using GitHub App)
        id: generate-token
        if: secrets.REPOOWL_APP_ID != '' && secrets.REPOOWL_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REPOOWL_APP_ID }}
          private-key: ${{ secrets.REPOOWL_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run RepoOwl PR Analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          CORE_TRIAGE_LABELS: '{"spam":"spam","invalid":"invalid","ai-slop":"ai-slop","prompt-injection":"prompt-injection","needs-triage":"needs-triage","duplicate":"duplicate","possible-duplicate":"possible-duplicate","security":"security"}'
        run: node .github/scripts/analyze-pr.js
