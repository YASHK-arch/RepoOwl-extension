name: Issue Assignment Rules

on:
  issues:
    types: [opened, labeled, unlabeled]
  issue_comment:
    types: [created]
  schedule:
    # Re-check queued assignment requests once per day.
    - cron: '17 0 * * *'
  workflow_dispatch:

jobs:
  # -- Auto-assign author on issue open (if labels are clean) ------------------
  auto-assign-on-open:
    if: >
      github.event_name == 'issues' &&
      (github.event.action == 'opened' ||
       github.event.action == 'labeled' ||
       github.event.action == 'unlabeled')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Assign author if no exclusion labels
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const EXCLUSION_LABELS = ['needs-triage', 'spam', 'duplicate'];
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name.toLowerCase());
            const hasExclusionLabel = labels.some(l => EXCLUSION_LABELS.includes(l));

            if (hasExclusionLabel) {
              core.info(`Issue #${issue.number} has an exclusion label -- skipping auto-assign.`);
              return;
            }

            // Check if the author is already an assignee
            const alreadyAssigned = issue.assignees.some(a => a.login === issue.user.login);
            if (alreadyAssigned) {
              core.info(`Author @${issue.user.login} is already assigned -- no action needed.`);
              return;
            }

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [issue.user.login],
            });
            core.info(`Auto-assigned issue #${issue.number} to its author @${issue.user.login}.`);

  # -- Queue a /assign me request from a non-author ----------------------------
  acknowledge-assignment-request:
    if: github.event_name == 'issue_comment' && github.event.action == 'created' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Queue a valid assignment request
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.comment.body.trim();
            const issue = context.payload.issue;

            // Requests are retained as comments; the scheduled job selects the oldest one.
            if (!/^\/assign\s+me$/i.test(body) || context.actor === issue.user.login) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `<img src="https://raw.githubusercontent.com/YASHK-arch/RepoOwl-extension/main/extension/public/icons/logo128.png" width="28" height="28" align="left" style="margin-right: 8px;"> **RepoOwl:** @${context.actor}, your assignment request is queued. It will be considered if @${issue.user.login} is inactive for 7 days and no pull request has been raised for this issue.`,
            });

  reassign-inactive-issues:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Reassign eligible issues
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const DAY = 24 * 60 * 60 * 1000;
            const INACTIVITY_PERIOD = 7 * DAY;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function getOpenIssues() {
              const issues = [];
              for await (const response of github.paginate.iterator(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', per_page: 100,
              })) {
                // The Issues API also returns pull requests, which must not be processed.
                issues.push(...response.data.filter((item) => !item.pull_request));
              }
              return issues;
            }

            async function hasLinkedPullRequest(issueNumber) {
              for await (const response of github.paginate.iterator(github.rest.issues.listEventsForTimeline, {
                owner, repo, issue_number: issueNumber, per_page: 100,
                headers: { accept: 'application/vnd.github+json' },
              })) {
                if (response.data.some((event) =>
                  event.event === 'cross-referenced' && event.source?.issue?.pull_request
                )) return true;
              }
              return false;
            }

            for (const issue of await getOpenIssues()) {
              const author = issue.user.login;
              const assignees = issue.assignees || [];

              // Respect a maintainer's manual assignment. This workflow only takes over
              // issues that are still assigned solely to their original author.
              if (assignees.length !== 1 || assignees[0].login !== author) continue;
              if (await hasLinkedPullRequest(issue.number)) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100,
              });

              // A comment from the original assignee resets their inactivity period.
              const authorActivity = comments
                .filter((comment) => comment.user?.login === author)
                .map((comment) => new Date(comment.updated_at || comment.created_at).getTime());
              const lastActivity = Math.max(new Date(issue.created_at).getTime(), ...authorActivity);
              if (Date.now() - lastActivity < INACTIVITY_PERIOD) continue;

              // Comments are returned oldest first. The first valid request wins.
              const request = comments.find((comment) =>
                comment.user?.login !== author && /^\/assign\s+me$/i.test(comment.body.trim())
              );
              if (!request) continue;

              const newAssignee = request.user.login;
              try {
                await github.rest.issues.addAssignees({
                  owner, repo, issue_number: issue.number, assignees: [newAssignee],
                });
                await github.rest.issues.removeAssignees({
                  owner, repo, issue_number: issue.number, assignees: [author],
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `<img src="https://raw.githubusercontent.com/YASHK-arch/RepoOwl-extension/main/extension/public/icons/logo128.png" width="28" height="28" align="left" style="margin-right: 8px;"> **RepoOwl:** @${author} has been inactive for 7 days with no linked pull request. This issue is now assigned to @${newAssignee}, the first contributor who requested it.`,
                });
              } catch (error) {
                core.warning(`Could not reassign issue #${issue.number}: ${error.message}`);
              }
            }
